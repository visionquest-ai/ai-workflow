# TEA YAML Agent - Import Matter Q&A Agent
# Story: 15.2 - ImportMatter YAML Workflow Agent
# Updated: Story 16.1 - Added context_node_id support
# Updated: Story MA-3b - Rewrite for Matter+MatterDetail (replaces ProtoMatter)
#
# Purpose: Orchestrates the full Q&A pipeline for a matter using only TEA
# built-in patterns and the graphology custom action.
# Fetches questions from graphology, runs parallel LLM calls,
# and persists responses back to the graph.
#
# After Q&A completion: updates Matter.analysisStatus to "completed" (or "error" on failure).
#
# Key constraint: Uses `uses:` actions for core Q&A; `uses:` action for finalize
#
# Rate Limiting (NFR-QA1):
#   - max_concurrency: controls how many LLM calls run simultaneously
#   - ratelimit.wrap: controls how fast requests are spaced (RPM/RPS)
#   Both are configurable via settings.parallel and settings.rate_limiters.
#
# Usage modes:
#   1. Via /run-agent (app.py pre-fetches context):
#      POST /run-agent { "agent": "import_matter_qa", "workflow_id": "...", "context_node_id": "..." }
#
#   2. Direct TEA engine with context_node_id + matter_detail_id + directory_code:
#      input: { "workflow_id": "...", "matter_id": "...", "context_node_id": "...",
#               "matter_detail_id": "...", "directory_code": "CH" }
#
#   3. Direct TEA engine with pre-loaded matter_context:
#      input: { "workflow_id": "...", "matter_id": "...", "matter_context": "..." }

name: import_matter_qa
description: |
  Executes all active prompts for the ImportMatter workflow.
  Fetches questions from graphology via GraphQL, runs parallel LLM calls,
  and persists responses back to the graph.

settings:
  llm:
    model: gpt-5.2-chat
    temperature: 1
  parallel:
    max_concurrency: 100
  rate_limiters:
    llm_qa:
      rpm: 500
  opik:
    project_name: "import-matter-qa"
  # Response control — governs tone, verbosity, and accuracy of QA answers
  response:
    mode: extractive         # extractive = only from document | generative = may infer
    verbosity: concise       # concise | balanced | detailed
    format: direct           # direct = plain answer | structured = with headers/bullets
    language: match_source   # match_source = same as document | pt-br | en

state_schema:
  # Input (required)
  workflow_id: str

  # Input (optional — provide context_node_id OR matter_context)
  context_node_id: str         # If set, agent fetches matter context via graphology.get_matter_context
  matter_id: str               # Defaults to context_node_id if not provided
  matter_detail_id: str        # MatterDetail node ID (required for fetch_context)
  directory_code: str          # Directory code: CH | L500 | LL | ITR | IFLR
  matter_context: str          # Text content of the matter document (JSON, markdown, plain text)
  system_prompt: str           # Custom system prompt for LLM calls

  # Intermediate
  context_result: dict         # Result from graphology.get_matter_context (when using context_node_id)
  fetch_result: dict           # Result from graphology.get_questions
  parallel_results: list       # Raw results from dynamic_parallel fan-out
  answers: list                # Mapped responses from collect_answers
  answer_count: int            # Count of collected answers

  title_result: dict            # Result from analysis.generate_title

  step_config: dict            # Result from analysis.get_step_config

  # Finalize
  finalize_result: dict        # Result from graphology.update_node (analysisStatus update)

  # Output
  save_result: dict            # Result from graphology.save_responses
  execution_ids: list          # Created PromptExecution IDs

nodes:
  - name: fetch_step_config
    uses: analysis.get_step_config
    with:
      step_name: "answer_question"
      workflow_name: "MatterQA"
      graphql_url: "{{ variables.GRAPHOLOGY_URL }}"
    output: step_config

  # Node 0: Fetch structured matter context if context_node_id is provided and matter_context is empty
  # Uses graphology.get_matter_context to fetch Matter + MatterDetail + Client + Department.
  # When called via /run-agent, matter_context may be pre-populated so this is skipped.
  - name: fetch_context
    uses: graphology.get_matter_context
    with:
      matter_id: "{{ state.matter_id or state.context_node_id }}"
      matter_detail_id: "{{ state.matter_detail_id }}"
      directory_code: "{{ state.directory_code }}"
      graphql_url: "{{ variables.GRAPHOLOGY_URL }}"
    output: context_result

  # Title Generation: Generate title if mTitle is null
  # Runs as an isolated step between fetch_context and fetch_questions.
  # Skipped when mTitle already exists (edge condition routes past it).
  - name: generate_title
    uses: analysis.generate_title
    with:
      matter_id: "{{ state.matter_id or state.context_node_id }}"
      matter_context_json: "{{ state.context_result.matter_context_json if state.context_result else state.matter_context }}"
      workflow_id: "{{ state.workflow_id }}"
      graphql_url: "{{ variables.GRAPHOLOGY_URL }}"
    output: title_result

  # Node 1: Fetch all active questions for the workflow
  - name: fetch_questions
    uses: graphology.get_questions
    with:
      workflow_id: "{{ state.workflow_id }}"
      graphql_url: "{{ variables.GRAPHOLOGY_URL }}"
    output: fetch_result

  # Node 2: Fan out parallel LLM calls — one per question
  # Each branch gets the prompt item injected as `prompt` in state.
  # max_concurrency controls how many branches run simultaneously.
  # ratelimit.wrap inside the action controls time-based rate limiting (RPM).
  # Partial failures are handled: failed branches produce ParallelFlowResult
  # with success=False, which collect_answers maps to status="failed".
  - name: answer_questions
    type: dynamic_parallel
    items: "{{ state.fetch_result.questions }}"
    item_var: prompt
    max_concurrency: "{{ settings.parallel.max_concurrency | default(10) }}"
    fan_in: collect_answers
    action:
      uses: ratelimit.wrap
      with:
        action: llm.call
        limiter: llm_qa
        rpm: "{{ settings.rate_limiters.llm_qa.rpm | default(60) }}"
        args:
          model: "{{ settings.llm.model }}"
          temperature: "{{ settings.llm.temperature }}"
          messages:
            - role: system
              content: >-
                {{ state.prompt.systemPrompt or state.system_prompt }}
            - role: user
              content: >-
                {% set context = state.matter_context or (state.context_result.matter_context_json if state.context_result else '') %}{% if context %}MATTER CONTEXT:

                {{ context }}

                ---

                QUESTION: {{ state.prompt.content }}{% else %}{{ state.prompt.content }}{% endif %}
      output: llm_result

  # Node 3: Fan-in — collect parallel results and map to response format
  # Transforms ParallelFlowResult list into the format expected by
  # graphology.save_responses (versionId, llmRequest, llmResponse, status).
  - name: collect_answers
    is_fan_in: true
    uses: graphology.collect_answers
    output: answers

  # Node 4: Persist all responses to the graph
  # When context_node_id is provided, links PromptExecution -> HAS_CONTEXT -> existing node
  # instead of creating new ContextNode copies. Uses union type syntax with context_node_type.
  - name: post_process_executions
    uses: analysis.post_process_batch
    with:
      step_config: "{{ state.step_config }}"
      answers: "{{ state.answers.answers }}"
      matter_id: "{{ state.matter_id or state.context_node_id }}"
      context_node_id: "{{ state.context_node_id }}"
      context_node_type: "Matter"
      graphql_url: "{{ variables.GRAPHOLOGY_URL }}"
    output: save_result

  # Node 5 (Story MA-3b): Finalize — update Matter.analysisStatus
  # Sets analysisStatus to "completed" on success or "error" on failure.
  - name: finalize_success
    uses: graphology.update_node
    with:
      node_id: "{{ state.matter_id or state.context_node_id }}"
      node_type: "Matter"
      updates:
        analysisStatus: "completed"
      graphql_url: "{{ variables.GRAPHOLOGY_URL }}"
    output: finalize_result

  - name: finalize_error
    uses: graphology.update_node
    with:
      node_id: "{{ state.matter_id or state.context_node_id }}"
      node_type: "Matter"
      updates:
        analysisStatus: "error"
      graphql_url: "{{ variables.GRAPHOLOGY_URL }}"
    output: finalize_result

  # Node 6: AI Review — rewrite the matter description using Q&A answers
  # Uses llm.call directly (not sub-agent) for reliable Azure OpenAI execution
  - name: rewrite_matter
    uses: llm.call
    with:
      model: "{{ settings.llm.model }}"
      system: |
        You are a legal directory submission writer. Rewrite the matter description
        to enrich it with concrete details about complexity, impact, innovation,
        team leadership, and client service. Write in the same language as the
        original. Be concise but comprehensive. Return ONLY the rewritten
        description text, no JSON or headers.
      prompt: |
        Original matter data:
        {{ state.matter_context }}

        Rewrite the matter description into a compelling legal directory submission.
    output: rewrite_result

  # Node 7: Create AI MatterDetail with rewritten description
  - name: create_ai_detail
    uses: analysis.create_ai_matter_detail
    with:
      matter_id: "{{ state.matter_id or state.context_node_id }}"
      directory_code: "{{ state.directory_code }}"
      rewritten_matter: "{{ state.rewrite_result.content or state.rewrite_result.result or state.rewrite_result }}"
      graphql_url: "{{ variables.GRAPHOLOGY_URL }}"
    output: ai_detail_result

edges:
  - from: __start__
    to: fetch_step_config
  - from: fetch_step_config
    to: fetch_context
    condition: "{{ state.context_node_id and not state.matter_context }}"
  - from: fetch_step_config
    to: fetch_questions
    condition: "{{ state.matter_context or not state.context_node_id }}"
  # Title generation: only when mTitle is null/empty
  - from: fetch_context
    to: generate_title
    condition: "{{ state.context_result and state.context_result.matter and not state.context_result.matter.mTitle }}"
  # Skip title generation when mTitle already exists
  - from: fetch_context
    to: fetch_questions
    condition: "{{ not state.context_result or not state.context_result.matter or state.context_result.matter.mTitle }}"
  - from: generate_title
    to: fetch_questions
  - from: fetch_questions
    to: answer_questions
  - from: answer_questions
    to: collect_answers
  - from: collect_answers
    to: post_process_executions
  - from: post_process_executions
    to: finalize_success
    condition: "{{ state.save_result and state.save_result.success }}"
  - from: post_process_executions
    to: finalize_error
    condition: "{{ not state.save_result or not state.save_result.success }}"
  - from: finalize_success
    to: rewrite_matter
    condition: "{{ state.directory_code and state.matter_detail_id }}"
  - from: finalize_success
    to: __end__
    condition: "{{ not state.directory_code or not state.matter_detail_id }}"
  - from: rewrite_matter
    to: create_ai_detail
  - from: create_ai_detail
    to: __end__
  - from: finalize_error
    to: __end__

config:
  raise_exceptions: false
